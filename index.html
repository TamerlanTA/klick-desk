    <script>
      // Пара к public/404.html: если пришли с ?p=tasks/123, возвращаем
      // настоящий адрес без перезагрузки, и React Router откроет нужную страницу.
      (function () {
        var p = new URLSearchParams(window.location.search).get("p");
        if (p !== null) {
          window.history.replaceState(null, "", "/klick-desk/" + p + window.location.hash);
        }
      })();
    </script>
