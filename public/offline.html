<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Нет подключения — Klick Desk</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px 20px;font:18px/1.6 system-ui,sans-serif;color:#23313b;background:#fff}main{max-width:640px;margin:12vh auto}h1{font-size:clamp(28px,6vw,44px);line-height:1.15}p{color:#59656e}button,a{display:inline-block;font:inherit;padding:12px 20px;border-radius:24px;border:1px solid #2856d8;text-decoration:none;cursor:pointer;margin:8px 8px 0 0}button{background:#2856d8;color:white}a{color:#2856d8}small{color:#59656e}</style></head>
<body><main><small>KLICK DESK · ОФЛАЙН</small><h1>Сейчас нет подключения</h1><p>Не удалось открыть эту страницу. Подключись к сети и повтори попытку или вернись к сохранённым задачам. Твои записи остаются в этом браузере.</p><button id="retry" type="button">Повторить подключение</button><a href="/klick-desk/tasks">Открыть задачи</a><p id="connection" role="status"></p></main>
<script>document.getElementById('retry').onclick=function(){location.reload()};function sync(){document.getElementById('connection').textContent=navigator.onLine?'Сеть доступна. Попробуй загрузить страницу снова.':'Ты без интернета.'}window.addEventListener('online',sync);window.addEventListener('offline',sync);sync();</script></body></html>
